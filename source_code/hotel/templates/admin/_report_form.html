<form class="filters" method="get" novalidate>
  <label class="field"><span>From</span><input class="input" type="date" name="start" value="{{ start }}"></label>
  <label class="field"><span>To</span><input class="input" type="date" name="end" value="{{ end }}"></label>
  <label class="field"><span>Group by</span><select class="input" name="group"><option value="day"{% if group == 'day' %} selected{% endif %}>Day</option><option value="month"{% if group == 'month' %} selected{% endif %}>Month</option></select></label>
  <button class="btn">Show report</button>
  {% if rep and not rep.empty %}<a class="btn ghost" href="{{ url_for(endpoint, start=start, end=end, group=group, format='xlsx') }}">Export Excel</a><a class="btn ghost" href="{{ url_for(endpoint, start=start, end=end, group=group, format='pdf') }}">Export PDF</a>{% endif %}
</form>
