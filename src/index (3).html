<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Horizon Hotel – Booking System Interface Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#14372f; --pine-2:#1f4e43; --pine-d:#0c241e; --pine-l:#e3ece8;
  --brass:#b8935a; --brass-d:#86622c; --brass-l:#f3ead8; --gold:#d3ae6e; --gold-h:#dcba80;
  --paper:#f4f2ed; --card:#fff; --line:#dfdbd0; --line-2:#ebe8df; --wash:#faf9f5;
  --ink:#1b2420; --muted:#59635e; --faint:#88918c;
  --ok:#2c6a4d; --ok-bg:#e2eee7; --warn:#80540f; --warn-bg:#f6ebd2; --bad:#9a2c3a; --bad-bg:#f6e3e6; --info:#2d5876; --info-bg:#e1eaf0; --mute-bg:#ebe8df;
  --r:3px; --r-lg:4px;
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:400 15px/1.6 var(--body);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:0;line-height:1.12}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hide{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}

/* ---------- shell ---------- */
.util{background:var(--pine-d);color:#aebfb8;font-size:13px}
.util .wrap{display:flex;align-items:center;gap:14px;min-height:42px;padding-top:6px;padding-bottom:6px}
.util .lbl{margin-right:2px}
.seg{display:inline-flex;gap:2px;background:rgba(255,255,255,.08);padding:3px;border-radius:var(--r)}
.seg button{padding:4px 14px;border-radius:2px;font-size:13px;font-weight:500;color:#c4d2cc;transition:background .15s,color .15s}
.seg button:hover{color:#fff}
.seg button.on{background:var(--paper);color:var(--pine);font-weight:600}
.ulink{margin-left:auto;display:inline-flex;gap:8px;align-items:center;color:#c4d2cc;font-weight:500;padding:4px 2px;border-bottom:1px solid transparent}
.ulink:hover,.ulink.on{color:#fff;border-bottom-color:var(--brass)}
.site{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.site .wrap{display:flex;align-items:center;gap:36px;min-height:80px}
.brand{display:flex;align-items:center;gap:12px;color:var(--pine)}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font:600 29px/1 var(--display);letter-spacing:.005em;white-space:nowrap}
.nav{display:flex;align-self:stretch;gap:26px;margin-right:auto}
.nav button{position:relative;display:flex;align-items:center;font-weight:500;font-size:15px;color:var(--muted);padding:0 2px;white-space:nowrap;transition:color .15s}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--pine);font-weight:600}
.nav button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--brass)}
.who{display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--brass);color:var(--pine);display:grid;place-items:center;font:700 14px var(--body);background:var(--brass-l)}
.who b{display:block;font-size:14px;line-height:1.25}.who small{color:var(--muted);font-size:13px}
main{max-width:1240px;margin:0 auto;padding:0 32px 72px;outline:0}
.ph{padding:44px 0 26px}
.ph h1{font-size:46px;color:var(--pine);font-weight:600}
.ph p{color:var(--muted);font-size:16px;margin-top:8px;max-width:62ch}
.foot{border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:13px}
.foot .wrap{padding-top:20px;padding-bottom:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:var(--r);background:var(--pine);color:#fff;font-weight:600;font-size:14.5px;border:1px solid var(--pine);letter-spacing:.01em;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--pine-2);border-color:var(--pine-2)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--pine);border-color:#cfcabd}.btn.ghost:hover{background:var(--wash);border-color:var(--pine)}
.btn.sun{background:var(--gold);border-color:var(--gold);color:var(--pine-d)}.btn.sun:hover{background:var(--gold-h);border-color:var(--gold-h)}
.btn.ok{background:var(--ok);border-color:var(--ok)}.btn.ok:hover{background:#235640;border-color:#235640}
.btn.bad{background:#fff;color:var(--bad);border-color:#e3bcc2}.btn.bad:hover{background:var(--bad-bg)}
.btn{white-space:nowrap}.dlg-f .btn,.btn.block{white-space:normal;text-align:center}
.btn.sm{padding:7px 14px;font-size:13.5px}.btn.block{width:100%}.btn.lg{padding:13px 26px;font-size:15.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:36px;height:36px;border-radius:var(--r);display:grid;place-items:center;color:var(--muted)}.icon-btn:hover{background:var(--paper);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>span{font-size:13.5px;font-weight:600;color:var(--ink)}
.input{width:100%;height:44px;padding:0 13px;background:#fff;border:1px solid #cdc8bb;border-radius:var(--r);outline:0;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;padding:11px 13px;resize:vertical}
.input:focus{border-color:var(--pine);box-shadow:0 0 0 3px rgba(184,147,90,.35)}
.input[disabled],.input[readonly]{background:var(--wash);color:var(--faint)}
.err{color:var(--bad);font-size:13.5px;display:flex;gap:6px;align-items:center}
.hint{color:var(--muted);font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.mute{background:var(--mute-bg);color:var(--muted)}
.chip{display:inline-block;padding:2px 10px;border-radius:2px;background:var(--wash);border:1px solid var(--line);font-size:13px;color:var(--muted)}

/* ---------- panels & tables ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line-2)}
.panel-h h2,.panel-h h3{font-size:25px;color:var(--pine)}
.panel-b{padding:24px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:13.5px;font-weight:600;color:var(--muted);padding:13px 24px;background:var(--wash);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:16px 24px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--wash)}
.tbl .r{text-align:right}.tbl .row{flex-wrap:nowrap}.tbl .code{font-weight:600;color:var(--pine);white-space:nowrap}
.tbl .num{white-space:nowrap}
.empty{padding:52px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--pine);font:600 24px var(--display);margin-bottom:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:20px}
.cols{display:grid;gap:24px}.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:22px 24px;border-top:3px solid var(--brass)}
.kpi small{color:var(--muted);font-size:14px}
.kpi b{display:block;font:600 42px/1.1 var(--display);color:var(--pine);margin:6px 0 4px}
.kpi span{font-size:13.5px;color:var(--muted)}.kpi .up{color:var(--ok);font-weight:600}
.sec-h{font-size:30px;color:var(--pine)}

/* ---------- customer: hero & room cards ---------- */
.hero{border-radius:var(--r-lg);color:#fff;position:relative;overflow:hidden;padding:60px 52px 124px;min-height:380px;background:linear-gradient(115deg,#0b231d 0%,#12342c 58%,#1b473d 100%)}
.hero .art{position:absolute;right:0;top:0;height:100%;width:54%;pointer-events:none}
.hero h2{font-size:60px;line-height:1.02;max-width:13ch;position:relative;z-index:1;color:#fff;font-weight:600}
.hero p{max-width:42ch;margin-top:18px;color:#cddad4;font-size:17px;position:relative;z-index:1}
.searchbar{position:relative;z-index:2;margin:-72px 40px 0;background:#fff;border:1px solid var(--line);border-top:3px solid var(--brass);border-radius:var(--r-lg);padding:22px 24px;display:grid;grid-template-columns:1.1fr 1.1fr .65fr .65fr 1.2fr auto;gap:16px;align-items:end;box-shadow:0 18px 40px -26px rgba(12,36,30,.6)}
.results-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:44px 0 20px}
.results-h h3{font-size:32px;color:var(--pine)}
.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.room{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s}
.room:hover{border-color:var(--brass);box-shadow:0 18px 36px -28px rgba(12,36,30,.7)}
.photo{height:210px;position:relative;overflow:hidden;background:#e7e2d6}
.photo svg.rm{position:absolute;inset:0;width:100%;height:100%;display:block}
.photo .tag{position:absolute;left:14px;top:14px;background:#fff;color:var(--pine);font-size:13px;font-weight:600;padding:3px 12px;border-radius:2px;z-index:1}
.photo .tag.low{background:var(--gold);color:var(--pine-d)}
.room-b{padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px;flex:1}
.room h4{font-size:29px;color:var(--pine)}
.meta{display:flex;gap:16px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.meta span{display:inline-flex;gap:7px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.price-row{margin-top:auto;padding-top:18px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:16px}
.price-row small{display:block;color:var(--muted);font-size:13.5px}
.price-row b{display:block;font:600 34px/1.1 var(--display);color:var(--pine);white-space:nowrap}
.price-row em{display:block;font-style:normal;color:var(--muted);font-size:13.5px}
.price-row .row{flex-wrap:nowrap}.price-row .row .btn{flex:1}

/* ---------- misc ---------- */
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:36px;align-items:end;height:260px;padding:6px 12px 0;position:relative;background:repeating-linear-gradient(to top,transparent 0 64px,var(--line-2) 64px 65px)}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bar i{display:block;width:100%;max-width:96px;border-top:3px solid var(--brass);background:var(--pine);transition:height .5s cubic-bezier(.2,.7,.2,1)}
.bar b{font:600 22px var(--display);color:var(--pine)}.bar span{color:var(--muted);font-size:13.5px}
.tabs{display:inline-flex;background:var(--mute-bg);padding:3px;border-radius:var(--r)}
.tabs button{padding:6px 16px;border-radius:2px;font-weight:600;font-size:14px;color:var(--muted)}.tabs button.on{background:#fff;color:var(--pine);box-shadow:0 1px 2px rgba(12,36,30,.15)}
.pay{display:flex;gap:12px;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.pay:has(input:checked){border-color:var(--pine);background:var(--pine-l)}
.pay input{accent-color:var(--pine)}
.sum{border:1px solid var(--line);border-radius:var(--r)}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line-2)}
.sum div:last-child{border-bottom:0}.sum .t{background:var(--wash);font-weight:700}.sum .t b{font:600 24px var(--display);color:var(--pine)}
.pend{display:flex;gap:16px;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line-2)}
.pend:last-child{border-bottom:0}
.pend b{font-weight:600}.pend small{display:block;color:var(--muted);font-size:14px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.flow .st{padding:6px 12px;background:#fff;border:1px solid var(--line);border-radius:2px;font-size:14px}
.flow .ar{color:var(--brass)}
.mock{text-align:left;padding:18px;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;display:flex;gap:14px;align-items:center;transition:border-color .15s,background .15s}
.mock:hover{border-color:var(--brass);background:var(--wash)}
.mock .bx{width:42px;height:42px;border-radius:50%;background:var(--brass-l);color:var(--brass-d);display:grid;place-items:center;flex:none}
.mock b{display:block;font-size:15px}.mock small{color:var(--muted);font-size:13.5px}

/* ---------- modal & toast ---------- */
.backdrop{position:fixed;inset:0;background:rgba(9,26,22,.6);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto;z-index:60;animation:fade .15s}
.dialog{background:#fff;border-radius:var(--r-lg);width:100%;max-width:500px;box-shadow:0 30px 70px -20px rgba(9,26,22,.65);animation:pop .18s cubic-bezier(.2,.8,.3,1)}
.dialog.wide{max-width:700px}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 26px;border-bottom:1px solid var(--line-2)}
.dlg-h h3{font-size:29px;color:var(--pine)}
.dlg-b{padding:24px 26px;display:flex;flex-direction:column;gap:18px}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:16px 26px;border-top:1px solid var(--line-2);background:var(--wash);border-radius:0 0 var(--r-lg) var(--r-lg)}
.dialog .photo{height:250px}
#toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:10px;z-index:80}
.toast{display:flex;gap:12px;align-items:flex-start;background:var(--pine-d);color:#fff;border-radius:var(--r);padding:14px 18px;min-width:300px;max-width:400px;box-shadow:0 14px 30px -12px rgba(9,26,22,.7);animation:pop .2s;border-left:4px solid #5fbf93}
.toast.bad{border-left-color:#e77d8e}.toast.info{border-left-color:var(--gold)}
.toast small{display:block;color:#b7c8c1;font-size:13.5px}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width:1100px){.rooms,.c3{grid-template-columns:repeat(2,minmax(0,1fr))}.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.searchbar{grid-template-columns:1fr 1fr;margin:-72px 24px 0}.searchbar .btn{grid-column:1/-1}.hero .art{opacity:.55}}
@media (max-width:900px){
  .wrap,main{padding-left:20px;padding-right:20px}
  .site .wrap{flex-wrap:wrap;gap:0 16px;min-height:0;padding-top:14px}
  .brand{order:1;margin-right:auto}.who{order:2}
  .nav{order:3;flex:0 0 100%;overflow-x:auto;margin-top:10px;gap:24px}.nav button{padding:12px 2px}
  .c2{grid-template-columns:1fr}.ph{padding:30px 0 20px}.ph h1{font-size:38px}
}
@media (max-width:640px){
  .util .lbl{display:none}.seg button{padding:4px 10px}
  .brand b{font-size:25px}.who div{display:none}.who .btn{white-space:nowrap;padding:6px 10px}
  .rooms,.c3,.c4{grid-template-columns:1fr}
  .hero{padding:34px 24px 108px}.hero h2{font-size:44px}.hero .art{display:none}
  .searchbar{grid-template-columns:1fr;margin:-76px 12px 0}
  #toasts{left:16px;right:16px}.toast{min-width:0;max-width:none}
  .pend{flex-direction:column;align-items:flex-start}
  .results-h{flex-direction:column;align-items:flex-start}.results-h h3{font-size:28px}
}

/* ---------- v3 additions ---------- */
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r);font-size:14px;border:1px solid;line-height:1.45}
.alert .ic{margin-top:2px}
.alert.bad{background:var(--bad-bg);border-color:#e6bcc3;color:#7d1f2c}
.alert.warn{background:var(--warn-bg);border-color:#e6d19a;color:var(--warn)}
.alert.info{background:var(--info-bg);border-color:#bfd2df;color:var(--info)}
.field>.err{color:var(--bad);font-weight:500;font-size:13px;min-height:0}
.field>.err:empty{display:none}
.input.bad,.input[aria-invalid="true"]{border-color:var(--bad);background:#fffafa}
.input.bad:focus{box-shadow:0 0 0 3px rgba(154,44,58,.2)}
.room.off .photo svg{filter:grayscale(.6) opacity(.85)}
.room.off h4{color:var(--muted)}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}
.steps{display:flex;gap:0;list-style:none;counter-reset:s;border-bottom:1px solid var(--line-2);margin:-4px 0 2px}
.steps li{flex:1;counter-increment:s;padding:0 0 12px;font-size:13.5px;font-weight:600;color:var(--faint);position:relative;display:flex;align-items:center;gap:8px}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:12px}
.steps li.on{color:var(--pine)}.steps li.on::after{content:"";position:absolute;left:0;right:12px;bottom:-1px;height:3px;background:var(--brass)}
.steps li.done{color:var(--ok)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{accent-color:var(--pine);width:17px;height:17px;margin-top:2px;flex:none}
fieldset.opts{border:0;display:flex;flex-direction:column;gap:10px;min-width:0}
fieldset.opts legend{font-size:13.5px;font-weight:600;margin-bottom:8px;padding:0}
.done{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--ok-bg);border-radius:var(--r);color:var(--ok)}
.done b{color:var(--ink);font-size:17px}
.mail{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--wash)}
.mail hr{border:0;border-top:1px solid var(--line);margin:12px 0}.mail p{margin:8px 0}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--line-2)}
.linkbtn{text-align:left;color:var(--pine);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.demo{background:var(--wash);border:1px dashed #cfc9b8;border-radius:var(--r);padding:10px 12px;font-size:13px}
tr.hl td{background:var(--brass-l)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.rcell{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.rcell.ok{border-left-color:var(--ok)}.rcell.info{border-left-color:var(--info)}.rcell.warn{border-left-color:#c8952f}.rcell.bad{border-left-color:var(--bad)}
.rcell .rn{font:600 28px/1 var(--display);color:var(--pine)}.rcell .btn{align-self:flex-start;margin-top:6px}
.dlg-f{flex-wrap:wrap}
@media print{.util,.site,.foot,#toasts,.dlg-f,.icon-btn,.ph .btn{display:none!important}body{background:#fff}.backdrop{position:static;background:none;padding:0}.dialog{box-shadow:none;max-width:none;border:0}main{padding:0}}
@media (max-width:1100px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.filters{grid-template-columns:1fr}.steps li{font-size:12.5px}.pager{flex-direction:column;align-items:flex-start}}

/* ---------- validation, alerts, details ---------- */

function userInfo(){const r=S.role;
 if(r==='desk')return['Le Minh Chau','Receptionist'];if(r==='admin')return['Tran Quoc Bao','Admin'];
 return S.user?[S.user.name,'Customer']:null}
function render(){
 const r=S.role,tk=r+'.'+S.page,[t,s]=TITLES[tk]||['',''];
 $('#pt').textContent=t;$('#ps').textContent=s;$('#ph').classList.toggle('hide',tk==='customer.search');document.title=t+' – Grand Horizon Hotel';

/* ---------------- customer: search ---------------- */
const STATUS={unpaid:['warn','Deposit due'],paid:['info','Awaiting confirmation'],confirmed:['ok','Confirmed'],completed:['mute','Completed'],cancelled:['bad','Cancelled'],rejected:['bad','Rejected by hotel']};
const pill=s=>`<span class="pill ${STATUS[s][0]}">${STATUS[s][1]}</span>`;
const opts=(a,b,v,fn=n=>n)=>Array.from({length:b-a+1},(_,i)=>a+i).map(n=>`<option value="${n}" ${n==v?'selected':''}>${fn(n)}</option>`).join('');
function pSearch(){const q=S.search;return `
<section class="hero">${HERO}<h2>Find a room that fits your stay</h2><p>Compare room types, see the total for your dates, and hold a room with a 30% deposit.</p></section>
<form class="searchbar" data-form="search" novalidate>
 <label class="field"><span>Check-in</span><input class="input" type="date" id="s-ci" min="${TODAY}" value="${q.ci}"></label>
 <label class="field"><span>Check-out</span><input class="input" type="date" id="s-co" value="${q.co}"></label>
 <label class="field"><span>Adults</span><select class="input" id="s-a">${opts(1,6,q.adults)}</select></label>
 <label class="field"><span>Children</span><select class="input" id="s-c">${opts(0,4,q.children)}</select></label>
 <label class="field"><span>Room type</span><select class="input" id="s-t"><option value="any">Any type</option>${TYPES.map(t=>`<option value="${t.id}" ${t.id===q.type?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label>
 <button class="btn sun lg" id="s-go">${ic('search')}Search</button>
 <div class="err" id="s-err" role="alert"></div>
</form>
<div id="results"></div>`}
function readSearch(){const q=S.search;q.ci=$('#s-ci').value;q.co=$('#s-co').value;q.adults=+$('#s-a').value;q.children=+$('#s-c').value;q.type=$('#s-t').value;validate();results()}
function validate(){const q=S.search,e=dateErr(q),el=$('#s-err');if(!el)return;
 el.innerHTML=e?ic('warn','sm')+e:'';
 const bad=!!e;$('#s-ci').setAttribute('aria-invalid',bad&&(!q.ci||q.ci<TODAY||nights(q.ci,q.co)<=0));$('#s-co').setAttribute('aria-invalid',bad&&(!q.co||nights(q.ci,q.co)<=0||nights(q.ci,q.co)>30));
 $('#s-go').disabled=bad}
function results(){
 const q=S.search,err=dateErr(q),box=$('#results');if(!box)return;
 if(err){box.innerHTML=`<div class="panel empty" style="margin-top:44px"><b>Check your dates</b>${err}</div>`;return}
 const n=nights(q.ci,q.co);
 let list=TYPES.filter(t=>(q.type==='any'||t.id===q.type)&&(q.price==='any'||(q.price==='lo'?t.rate<1000000:t.rate>=1000000)));
 list.sort((a,b)=>q.sort==='asc'?a.rate-b.rate:b.rate-a.rate);
 const maxCap=Math.max(...TYPES.map(t=>t.cap));
 let html=`<div class="results-h"><h3>${list.length} room type${list.length===1?'':'s'} for ${n} night${n>1?'s':''}, ${guests(q)} guest${guests(q)>1?'s':''}</h3>
  <div class="row"><label class="row hint"><span>Price</span><select class="input" style="width:auto;height:38px" data-change="price"><option value="any" ${q.price==='any'?'selected':''}>Any</option><option value="lo" ${q.price==='lo'?'selected':''}>Under 1,000,000 VND</option><option value="hi" ${q.price==='hi'?'selected':''}>1,000,000 VND and up</option></select></label>
  <label class="row hint"><span>Sort by</span><select class="input" style="width:auto;height:38px" data-change="sort"><option value="asc" ${q.sort==='asc'?'selected':''}>Price, low to high</option><option value="desc" ${q.sort==='desc'?'selected':''}>Price, high to low</option></select></label></div></div>`;
 if(guests(q)>maxCap)html+=`<div class="alert bad" role="alert">${ic('warn')}<div><b>No single room sleeps ${guests(q)} guests</b>Our largest room sleeps ${maxCap}. Reduce the number of guests or make two separate bookings.</div></div>`;
 html+=list.length?`<div class="rooms">${list.map(t=>roomCard(t,n)).join('')}</div>`:`<div class="panel empty"><b>No room matches these filters</b>Try “Any type” or a different price range.</div>`;
 box.innerHTML=html;
}
const photo=(t,tag,sold)=>`<div class="photo ${sold?'sold':''}">${art(t.id)}${tag?`<span class="tag ${sold?'out':t.left<=2?'low':''}">${tag}</span>`:''}</div>`;
function roomCard(t,n){const q=S.search,left=roomsLeft(t,q),ce=capErr(t,q),off=ce||left<=0,tot=t.rate*n;
 return `<article class="room">${photo(t,left<=0?'Sold out':`${left} room${left>1?'s':''} left`,left<=0)}<div class="room-b"><h4>${esc(t.name)}</h4>
 <div class="meta"><span>${ic('bed','sm')}${t.bed}</span><span>${ic('guests','sm')}Up to ${t.cap}</span><span>${ic('expand','sm')}${t.area} m²</span></div>
 <div class="chips">${t.am.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}</div>
 ${ce?`<div class="err" role="alert">${ic('warn','sm')}<span>${ce}</span></div>`:''}${left<=0&&!ce?`<div class="err" role="alert">${ic('warn','sm')}<span>No rooms left for these dates. Try other dates.</span></div>`:''}
 <div class="price-row"><div><small>Total for ${n} night${n>1?'s':''}</small><b>${fmt(tot)}</b><em>${fmt(t.rate)} per night</em><em class="dep">Deposit today (30%): <b>${fmt(deposit(tot))}</b></em></div>
 <div class="row"><button class="btn ghost sm" data-act="detail:${t.id}">Details</button><button class="btn sm" data-act="book:${t.id}" ${off?'disabled':''} ${ce?`title="${esc(ce)}"`:''}>Book now</button></div></div></div></article>`}

function pProfile(){if(!S.user)return needLogin('your profile');const u=S.user;return `<form class="panel" style="max-width:640px" data-form="profile"><div class="panel-h"><h2>Contact details</h2></div><div class="panel-b stack" style="gap:16px">

const bill=(g,late)=>{const n=Math.max(1,nights(g.ci,g.co)),room=n*T(g.type).rate,svc=g.svc.reduce((a,s)=>a+s.q*s.p,0),lf=late?T(g.type).rate/2:0,sub=room+svc+lf,vat=Math.round(sub*.1),total=sub+vat;return{n,room,svc,lf,sub,vat,total,bal:total-g.dep}};

 const avail=S.rooms.filter(r=>r.s==='Available').length;

 <div class="panel">${S.pending.length?S.pending.map(p=>`<div class="pend"><div><b>${p.code}</b> &nbsp;${esc(p.guest)}<small>${esc(T(p.type).name)}, ${dmy(p.ci)} to ${dmy(p.co)}, deposit ${fmt(p.dep)}. Booked ${p.at}</small>

function pInhouse(){return `<div class="panel"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Room</th><th>Guest</th><th>Stay</th><th class="r">Services</th><th class="r">Balance now</th><th class="r"></th></tr></thead><tbody>

let lastFocus=null;
function modal(title,body,foot='',wide=false,head=''){lastFocus=document.activeElement;
 $('#modal-root').innerHTML=`<div class="backdrop" data-act="backdrop"><div class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="mt">${head}<div class="dlg-h"><h3 id="mt">${title}</h3><button class="icon-btn" data-act="close" aria-label="Close">${ic('x')}</button></div><div class="dlg-b">${body}</div>${foot?`<div class="dlg-f">${foot}</div>`:''}</div></div>`;
 setTimeout(()=>{const d=$('.dialog input:not([readonly]):not([type=radio]):not([type=checkbox]),.dialog select,.dialog .btn:not([disabled])');d&&d.focus()},30)}
function closeM(){$('#modal-root').innerHTML='';lastFocus&&lastFocus.focus&&lastFocus.focus()}
function toast(msg,sub='',type=''){const t=document.createElement('div');t.className='toast '+type;t.innerHTML=`<div><b>${msg}</b>${sub?`<small>${sub}</small>`:''}</div>`;$('#toasts').append(t);setTimeout(()=>t.remove(),4800)}
const sumRows=(rows,total)=>`<div class="sum">${rows.map(r=>`<div><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}${total?`<div class="t"><span>${total[0]}</span><b>${total[1]}</b></div>`:''}</div>`;
const errBox=(id,msg='')=>`<div class="err" id="${id}" role="alert">${msg?ic('warn','sm')+msg:''}</div>`;
const POLICY=[['Check-in','From 14:00, with an ID or passport'],['Check-out','By 12:00. Later departures pay half a night'],['Deposit','30% of the room total, rounded to the nearest 1,000 VND, due within 24 hours'],['Cancellation','100% refund at 48 hours or more before check-in, 50% from 24 to 48 hours, none under 24 hours'],['Stay length','Up to 30 nights per booking']];

 modal(esc(t.name),`<p>${esc(t.desc)}</p><div class="meta"><span>${ic('bed','sm')}${t.bed}</span><span>${ic('guests','sm')}Up to ${t.cap} guests</span><span>${ic('expand','sm')}${t.area} m²</span></div><div class="chips">${t.am.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}</div>
 ${sumRows(POLICY)}${de?errBox('dt-err',de):ce?errBox('dt-err',ce):left<=0?errBox('dt-err','No rooms left for these dates. Try other dates.'):''}`,

 <p class="hint">The new rate applies to new bookings only.</p></form>`,`<button class="btn ghost" data-act="close">Cancel</button><button class="btn" form="ty">${t?'Save changes':'Add room type'}</button>`)}

/* ---------------- actions ---------------- */
const owner=b=>S.accounts.find(a=>a.email===b.owner)||{name:'Guest',phone:''};

const A={
 role:(_,r)=>{S.flash=null;go(r)},page:(_,p)=>{S.flash=null;go(S.role,p)},docs:()=>go('docs','map'),close:closeM,backdrop:closeM,

  go('customer','bookings');mConfirm(c)},
 bdetail:(_,c)=>mBDetail(c),change:(_,c)=>mChange(c),cancel:(_,c)=>mCancel(c),

 copy:(_,c)=>{try{navigator.clipboard.writeText(c)}catch(e){}toast('Code copied',c)},
 inv:(_,c)=>mInvoiceView(c),print:()=>toast('Sent to the printer'),

  if(p&&p.ci===TODAY)S.arrivals.push({code:p.code,guest:p.guest,phone:p.phone,type:p.type,ci:p.ci,co:p.co,dep:p.dep});
  toast('Booking confirmed',`${c}: confirmation email sent to the customer.`);render()},
 reject:(_,c)=>mReject(c),walkin:mWalk,checkin:(_,c)=>mCheckin(c),svc:(_,c)=>mSvc(c),checkout:(_,c)=>mCheckout(c),
 docheckout:(_,c,l)=>{const g=S.inhouse.find(x=>x.code===c),b=bill(g,l==='1'),inv=`INV-${TODAY.replace(/-/g,'')}-${pad(S.invSeq++,4)}`,pm=($('#co-pm')||{}).value||'Cash';S.rooms.find(r=>r.n===g.room).s='Cleaning';S.inhouse=S.inhouse.filter(x=>x!==g);
  const bk=S.mine.find(x=>x.code===c);if(bk){bk.status='completed';bk.inv=inv}
  closeM();toast('Check-out complete',`${inv} issued. Room ${g.room} is now marked Cleaning.`);render();mInvDesk(inv,g,b,pm)},
 export:(_,k)=>toast(`Report exported to ${k}`,`Revenue and occupancy, ${REPORT[S.period].label}.`),metric:(_,m)=>{S.metric=m;render()},period:(_,p)=>{S.period=p;render()},actor:(_,a)=>{S.actor=a;render()},
 addroom:()=>mRoom(),editroom:(_,n)=>mRoom(n),
 addtype:()=>mType(),edittype:(_,i)=>mType(i),

 addsvc:()=>mSvcAdmin(),editsvc:(_,i)=>mSvcAdmin(i),delsvc:(_,i)=>{const s=S.services.splice(+i,1)[0];toast('Service removed',s.n);render()},

 shot:(_,k,v)=>{const m={auth:()=>{go('customer','search');mAuth('login')},c:()=>go('customer','search'),d:()=>go('desk','overview'),a:()=>go('admin','dash')};

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const [n,...a]=t.dataset.act.split(':');if(!A[n]||(n==='backdrop'&&e.target!==t))return;A[n](t,...a)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').firstChild)closeM()});
function live(e){const f=e.target.closest('form[data-form]');if(!f)return false;const [n,a]=f.dataset.form.split(':');
 if(n==='search'){readSearch();return true}if(n==='mkbook'){bkRefresh(a);return true}if(n==='change'){chgRefresh(a);return true}return false}
document.addEventListener('input',e=>{if(e.target.dataset.input==='arr'){const q=e.target.value.toLowerCase().trim();$('#arr-b').innerHTML=arrRows(S.arrivals.filter(a=>(a.code+a.guest+a.phone).toLowerCase().includes(q)))}else live(e)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-change]');
 if(t){const [n,c]=t.dataset.change.split(':');if(n==='sort'){S.search.sort=t.value;results()}if(n==='price'){S.search.price=t.value;results()}if(n==='late')mCheckout(c,t.checked);return}
 live(e)});
const mail=s=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s),digits=s=>(s||'').replace(/\D/g,'').length;
function signedIn(u){S.user={email:u.email,name:u.name,phone:u.phone,pw:u.pw};closeM();const aft=S.after;S.after=null;render();if(aft&&aft.book)mBook(aft.book)}
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const [n,a]=f.dataset.form.split(':'),d=Object.fromEntries(new FormData(f));
 if(n==='search'){readSearch()}
 if(n==='mkbook'){const t=T(a),q=S.search,ad=+d.a,ch=+d.c,ce=capErr(t,{adults:ad,children:ch}),de=dateErr(q);if(ce||de||roomsLeft(t,q)<=0)return;
  const nn=nights(q.ci,q.co),total=t.rate*nn,code=newCode(q.ci);q.adults=ad;q.children=ch;
  S.mine.unshift({code,owner:S.user.email,type:a,ci:q.ci,co:q.co,adults:ad,children:ch,note:(d.note||'').trim(),total,dep:0,status:'unpaid',fresh:true,made:'30/10 '+clock(),hold:'31/10 '+clock()});
  syncPending(S.mine[0]);S.flash=code;closeM();go('customer','bookings');mPay(code)}
 if(n==='change'){const c=chgCalc(a);if(c.e)return;const b=c.b;b.ci=c.q.ci;b.co=c.q.co;b.total=c.total;b.fresh=true;S.flash=a;
  if(c.diff===null){syncPending(b);closeM();toast('Dates changed',`${a} now runs ${dmy(b.ci)} to ${dmy(b.co)}. The deposit is now ${fmt(c.nd)}.`);render()}
  else if(c.diff>0){b.status='unpaid';b.hold='31/10 '+clock();syncPending(b);closeM();render();toast('Dates changed','Pay the extra deposit to keep the booking.','info');mPay(a)}
  else{b.dep=c.nd;syncPending(b);closeM();toast('Dates changed',c.diff<0?`${fmt(-c.diff)} goes back to your payment method.`:'Your deposit does not change.');render()}}
 if(n==='profile'){const er=$('#pf-err');er.textContent='';
  if(!d.name.trim())return er.textContent='Enter your full name.';
  if(digits(d.phone)<9)return er.textContent='Enter a valid phone number.';
  if(d.new){if(d.cur!==S.user.pw)return er.textContent='Your current password is not correct.';if(d.new.length<8)return er.textContent='The new password needs at least 8 characters.'}
  const acct=S.accounts.find(x=>x.email===S.user.email);acct.name=S.user.name=d.name.trim();acct.phone=S.user.phone=d.phone.trim();if(d.new)acct.pw=S.user.pw=d.new;toast('Profile updated');render()}
 if(n==='auth'){const er=$('#au-err'),v=S.auth;er.textContent='';const bad=m=>er.innerHTML=ic('warn','sm')+m;
  if(v==='login'){const u=S.accounts.find(x=>x.email===(d.email||'').trim().toLowerCase()&&x.pw===d.pw);if(!u)return bad('The email or password is not correct.');toast('Signed in',`Welcome back, ${esc(u.name)}.`);signedIn(u)}
  else if(v==='register'){const em=(d.email||'').trim().toLowerCase();
   if(!(d.name||'').trim())return bad('Enter your full name.');if(!mail(em))return bad('Enter a valid email address.');if(S.accounts.some(x=>x.email===em))return bad('An account with this email already exists. Sign in instead.');
   if(digits(d.phone)<9)return bad('Enter a valid phone number.');if((d.pw||'').length<8)return bad('Use a password with at least 8 characters.');
   const u={email:em,pw:d.pw,name:d.name.trim(),phone:d.phone.trim()};S.accounts.push(u);toast('Account created',`Welcome, ${esc(u.name)}.`);signedIn(u)}
  else if(v==='forgot'){const em=(d.email||'').trim().toLowerCase();if(!mail(em))return bad('Enter a valid email address.');S.resetEmail=em;S.auth='reset';toast('Reset code sent','It works once and expires in 30 minutes.','info');mAuth()}
  else{if(d.code!=='123456')return bad('This code is not correct or has expired.');if((d.pw||'').length<8)return bad('Use a password with at least 8 characters.');const u=S.accounts.find(x=>x.email===S.resetEmail);if(u)u.pw=d.pw;toast('Password updated','Sign in with your new password.');mAuth('login')}}
 if(n==='reject'){if(!(d.why||'').trim())return $('#rj-err').innerHTML=ic('warn','sm')+'Enter a reason so the customer knows why.';const b=S.mine.find(x=>x.code===a);if(b)b.status='rejected';S.pending=S.pending.filter(p=>p.code!==a);closeM();toast('Booking rejected',`${a}: the customer was notified and the deposit queued for refund.`,'info');render()}
 if(n==='walk'){const er=$('#wk-err'),bad=m=>er.innerHTML=ic('warn','sm')+m,t=T(d.t),nn=+d.n,gq=+d.q;
  if(!(d.g||'').trim())return bad('Enter the guest’s name.');if(digits(d.p)<9)return bad('Enter a valid phone number.');
  if(!(nn>=1&&nn<=30))return bad('A stay is 1 to 30 nights.');if(gq<1)return bad('Enter the number of guests.');if(gq>t.cap)return bad(`${t.name} sleeps up to ${t.cap} guests, but you entered ${gq}.`);
  if(!S.rooms.some(r=>r.t===d.t&&r.s==='Available'))return bad('No room of this type is available today. Pick another type.');
  const code=newCode(TODAY);S.arrivals.unshift({code,guest:d.g.trim(),phone:d.p.trim(),type:d.t,ci:TODAY,co:addDays(TODAY,nn),dep:0});closeM();toast('Walk-in booking confirmed',`${code} is ready for check-in.`);go('desk','checkin')}
 if(n==='checkin'){if((d.id||'').trim().length<6)return $('#ci-err').innerHTML=ic('warn','sm')+'Enter the ID or passport number to check in.';
  const g=S.arrivals.find(x=>x.code===a);S.arrivals=S.arrivals.filter(x=>x!==g);S.rooms.find(r=>r.n===d.room).s='Occupied';S.inhouse.push({room:d.room,code:g.code,guest:g.guest,type:g.type,ci:g.ci,co:g.co,dep:g.dep,svc:[]});closeM();toast('Guest checked in',`${esc(g.guest)} is in room ${d.room}.`);render()}
 if(n==='svc'){const g=S.inhouse.find(x=>x.code===a),s=S.services[+d.s],q=Math.max(1,+d.q||1);g.svc.push({n:s.n,q,p:s.p});closeM();toast('Service added',`${esc(s.n)} × ${q} for ${esc(g.guest)}.`);render()}
 if(n==='room'){const er=$('#rm-err');
  if(a){const r=S.rooms.find(x=>x.n===a);if(r.s==='Occupied'&&d.s==='Maintenance')return er.innerHTML=ic('warn','sm')+'An occupied room cannot go into maintenance. Check the guest out first.';r.t=d.t;r.f=+d.f;r.s=d.s;toast('Room updated',`Room ${a} saved.`)}
  else{const nn=(d.n||'').trim();if(!nn)return er.innerHTML=ic('warn','sm')+'Enter a room number.';if(S.rooms.some(x=>x.n===nn))return er.innerHTML=ic('warn','sm')+'This room number already exists.';S.rooms.push({n:nn,t:d.t,f:+d.f,s:d.s});S.rooms.sort((x,y)=>x.n.localeCompare(y.n));toast('Room added',`Room ${nn} is in the list.`)}
  closeM();render()}
 if(n==='type'){const er=$('#ty-err'),bad=m=>er.innerHTML=ic('warn','sm')+m,cap=+d.cap,area=+d.area,rate=+d.rate;
  if(!(d.name||'').trim())return bad('Enter a name.');if(!(d.bed||'').trim())return bad('Enter the bed type.');if(!(cap>=1&&cap<=8))return bad('Capacity is 1 to 8 guests.');if(!(area>=10))return bad('Enter the size in m².');if(!(rate>=100000))return bad('The rate must be at least 100,000 VND.');
  if(TYPES.some(x=>x.name.toLowerCase()===d.name.trim().toLowerCase()&&x.id!==a))return bad('A room type with this name already exists.');
  const am=(d.am||'').split(',').map(x=>x.trim()).filter(Boolean);
  if(a){Object.assign(T(a),{name:d.name.trim(),bed:d.bed.trim(),cap,area,rate,am});toast('Room type saved',d.name.trim())}
  else{TYPES.push({id:'t'+Date.now().toString(36),name:d.name.trim(),bed:d.bed.trim(),cap,area,rate,left:2,am,desc:'A room added by the hotel admin.'});toast('Room type added',d.name.trim())}
  closeM();render()}
 if(n==='svcadmin'){const er=$('#sa-err'),bad=m=>er.innerHTML=ic('warn','sm')+m,p=+d.p;if(!(d.n||'').trim())return bad('Enter a service name.');if(!(p>=1000))return bad('The price must be at least 1,000 VND.');
  if(a!==''){S.services[+a]={n:d.n.trim(),p};toast('Service saved',d.n.trim())}else{S.services.push({n:d.n.trim(),p});toast('Service added',d.n.trim())}closeM();render()}
 if(n==='staff'){const er=$('#st-err'),bad=m=>er.innerHTML=ic('warn','sm')+m,em=(d.e||'').trim().toLowerCase();if(!(d.n||'').trim())return bad('Enter the full name.');if(!mail(em))return bad('Enter a valid email address.');if(S.staff.some(s=>s.e===em))return bad('A staff account with this email already exists.');
  S.staff.push({n:d.n.trim(),e:em,r:d.r,on:true});closeM();toast('Staff account created',`A temporary password was emailed to ${em}.`);render()}
});
render();
