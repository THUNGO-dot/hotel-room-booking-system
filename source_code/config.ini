; Grand Horizon Hotel - business parameters (NFR-05)
; Change a value here and restart the application. No source file needs editing.

[business]
; BR-13: deposit = 30% of the room charge, rounded to the nearest 1,000 VND
deposit_rate = 0.30
deposit_rounding = 1000
; BR-10: an unpaid booking holds its room for 24 hours
hold_hours = 24
; Invoice VAT (UC-08)
vat_rate = 0.10
; BR-20: check-out after 12:00 adds 50% of one night
late_checkout_hour = 12
late_fee_rate = 0.5
; Standard check-in time shown on the policy and used for refund tiers
checkin_hour = 14
; BR-06: a stay is at most 30 nights
max_nights = 30
; BR-12: refund 100% at >= 48 h, 50% at >= 24 h, 0% below
refund_full_hours = 48
refund_half_hours = 24
refund_half_rate = 50
; FR-11: dates can be changed until 48 h before check-in
change_min_hours = 48

[security]
; BR-02: minimum password length
min_password_length = 8
; BR-05: the account is locked on the 5th failed login
max_failed_logins = 5
; CR-01: idle session timeout in minutes
session_minutes = 30
; BR-04: reset code lifetime in minutes (single use)
reset_code_minutes = 30
; Replace this in production
secret_key = change-me-before-deploying

[system]
; CR-07: lists show 10 rows per page
page_size = 10
; BR-35: confirmation e-mails are retried up to 3 times
email_max_attempts = 3
database = instance/hotel.db
; demo_mode shows the simulated e-mail outbox and the "decline payment" switch
demo_mode = true
; Leave empty to use the real clock, or set e.g. 2026-11-05 12:00:00 for a fixed demo date
fixed_now =
